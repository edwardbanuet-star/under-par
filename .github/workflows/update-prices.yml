name: Update prices

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices from SerpApi
        run: python scripts/update_prices.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          MAX_SEARCHES: "8"
      - name: Commit updated prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
